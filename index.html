<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Odyssey Battle Royale</title>
<meta name="description" content="Odyssey Battle Royale. A 50 player battle royale island built in UEFN. Coming soon.">
<link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="img/icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/icon-180.png">
<meta name="theme-color" content="#ffd21f">
<style>
@font-face{
  font-family:'Azo Sans Uber';
  src:url('fonts/AzoSansUber.otf') format('opentype');
  font-display:swap;
}
:root{
  --bg:#07080b; --ink:#f2f4f8; --mute:#8b93a4; --acc:#ffd21f;
  --display:'Azo Sans Uber',Impact,'Arial Black',system-ui,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body);
  display:flex; align-items:center; justify-content:center; padding:28px;
}
.glow{
  position:fixed; inset:0; pointer-events:none;
  background:radial-gradient(60% 45% at 50% 42%, rgba(255,210,31,.09), transparent 70%);
}
.box{position:relative; text-align:center; max-width:660px}
.box img{width:min(460px,84vw); height:auto; display:block; margin:0 auto 34px}
.tag{
  font-family:var(--display); letter-spacing:.26em; text-transform:uppercase;
  font-size:clamp(15px,2.4vw,20px); color:var(--acc); margin:0 0 16px;
}
.sub{color:var(--mute); font-size:16px; line-height:1.7; margin:0}
.rule{
  width:74px; height:2px; margin:26px auto 24px;
  background:linear-gradient(90deg,transparent,var(--acc),transparent);
}
.foot{
  position:fixed; left:0; right:0; bottom:18px; text-align:center;
  color:#5c6474; font-size:12px; line-height:1.6; padding:0 20px;
}
</style>
</head>
<body>
<div class="glow"></div>
<div class="box">
  <img src="img/odyssey-logo-lg.png" alt="Odyssey Battle Royale">
  <div class="rule"></div>
  <p class="tag">Coming Soon</p>
  <p class="sub">A 50 player battle royale island built in UEFN. Back shortly.</p>
</div>
<div class="foot">
  Odyssey Battle Royale is a user-created experience made within Fortnite Creative.
  This is not sponsored, endorsed, or administered by Epic Games, Inc.
</div>
</body>
</html>
