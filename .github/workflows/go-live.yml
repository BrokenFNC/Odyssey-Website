name: Go live

# Publishes the finished site at launch time by restoring everything from the
# launch branch onto main, which is what GitHub Pages serves.
#
# Scheduled for 13:30 UTC on 31 August 2026, which is 11:00 in Newfoundland
# (NDT, UTC-2:30). GitHub runs cron in UTC only.
#
# GitHub's scheduled runners are frequently a few minutes late under load, so
# treat this as "shortly after 11:00" rather than exactly on the hour. If it has
# not fired and you want it live now, open the Actions tab, pick "Go live" and
# press "Run workflow". That does exactly the same thing.

on:
  schedule:
    - cron: '30 13 31 8 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: go-live
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore the site from the launch branch
        run: |
          git fetch origin launch
          git checkout origin/launch -- .

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Site already matches the launch branch, nothing to publish."
            exit 0
          fi
          git commit -m "Go live: restore the site from the launch branch"
          git push origin HEAD:main
          echo "Published. GitHub Pages will rebuild within about a minute."
