<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOA TERMINAL</title>
<meta name="robots" content="noindex">

<link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/icon-180.png">
<meta name="theme-color" content="#000000">
<style>
:root{
  --bg:#000;
  --fg:#fff;
  --dim:rgba(255,255,255,.42);
  --mid:rgba(255,255,255,.68);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--mono);
  font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

/* faint scanlines and a vignette. Kept very low so it reads as texture, not decoration. */
.crt::before{
  content:"";position:fixed;inset:0;z-index:3;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);
}
.crt::after{
  content:"";position:fixed;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.55));
}

/* The logo is black artwork on a white background, so it is inverted to white
   and screen-blended, which drops the white box away and leaves just the mark. */
.mark{
  position:fixed;left:50%;top:52%;transform:translate(-50%,-50%);
  width:min(64vmin,560px);height:auto;z-index:1;pointer-events:none;user-select:none;
  filter:invert(1);mix-blend-mode:screen;opacity:.07;
}
.brand{display:flex;align-items:center;gap:11px}
.brand img{
  width:19px;height:19px;flex:0 0 auto;
  filter:invert(1);mix-blend-mode:screen;opacity:.8;
}

.screen{
  position:relative;z-index:2;height:100%;
  max-width:860px;margin:0 auto;padding:34px 26px 26px;
  display:flex;flex-direction:column;
}

.bar{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  border-bottom:1px solid rgba(255,255,255,.22);
  padding-bottom:10px;margin-bottom:18px;
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  flex:0 0 auto;
}
.bar a{color:var(--dim);text-decoration:none;border-bottom:1px solid transparent}
.bar a:hover{color:var(--fg);border-bottom-color:var(--fg)}
.bar .right{display:flex;align-items:center;gap:16px}
.bar button{
  background:none;border:none;padding:0;cursor:pointer;
  font:inherit;letter-spacing:inherit;text-transform:inherit;
  color:var(--dim);border-bottom:1px solid transparent;
}
.bar button:hover{color:var(--fg);border-bottom-color:var(--fg)}

/* The lock screen. Deliberately not shaped like the terminal: a centred, bordered
   plate with the mark on it, rather than a scrolling log with a prompt. You should
   be able to tell at a glance that you are not in yet. */
.gate{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:24px 0}
.gatebox{
  width:min(430px,100%);border:1px solid rgba(255,255,255,.38);
  padding:36px 34px 30px;text-align:center;position:relative;
  background:rgba(255,255,255,.015);
}
/* corner ticks, so it reads as a piece of hardware */
.gatebox::before,.gatebox::after{
  content:"";position:absolute;width:12px;height:12px;pointer-events:none;
  border:1px solid rgba(255,255,255,.75);
}
.gatebox::before{top:-1px;left:-1px;border-right:none;border-bottom:none}
.gatebox::after{bottom:-1px;right:-1px;border-left:none;border-top:none}

.gatemark{
  width:56px;height:56px;margin:0 auto 20px;display:block;
  filter:invert(1);mix-blend-mode:screen;opacity:.9;
}
.gtitle{font-size:13px;letter-spacing:.26em;text-transform:uppercase}
.gsub{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:7px 0 28px}

.gfield{
  display:flex;align-items:center;gap:11px;
  border-bottom:1px solid rgba(255,255,255,.45);padding-bottom:9px;margin-bottom:20px;
}
.gps{color:var(--fg)}
#pw{
  flex:1 1 auto;background:transparent;border:none;outline:none;
  color:var(--fg);font-family:var(--mono);font-size:16px;letter-spacing:.4em;
  caret-color:var(--fg);padding:0;
}
.gmsg{
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);min-height:1.5em;transition:color .15s;
}
.gmsg.bad{color:var(--fg)}
/* the Resistance talking. Lower case and loosely spaced, because it is a person
   typing, not the VOA's machine printing. */
.gmsg.res{color:var(--fg);text-transform:none;letter-spacing:.04em;font-size:13px}
/* the moment they take the plate: the whole panel inverts. No colour needed, the
   flip alone says something else is driving. */
.gatebox.flash{background:#fff;border-color:#fff;color:#000}
.gatebox.flash .gtitle,
.gatebox.flash .gsub,
.gatebox.flash .gmsg,
.gatebox.flash .gps{color:#000}
.gatebox.flash #pw{color:#000;caret-color:#000}
.gatebox.flash .gfield{border-bottom-color:rgba(0,0,0,.5)}
.gatebox.flash .gatemark{filter:none;mix-blend-mode:normal}
.gatebox.flash::before,.gatebox.flash::after{border-color:#000}
.gatebox.shake{animation:shake .34s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  10%,90%{transform:translateX(-2px)}
  20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)}
  40%,60%{transform:translateX(7px)}
}

/* Scrolls, but the bar itself is hidden. A visible scrollbar is the one piece of
   browser chrome that breaks the illusion of a screen. Wheel, touch and keyboard
   scrolling all still work. */
.out{
  flex:1 1 auto;overflow-y:auto;white-space:pre-wrap;word-break:break-word;
  scrollbar-width:none;          /* Firefox */
  -ms-overflow-style:none;       /* old Edge and IE */
}
.out::-webkit-scrollbar{width:0;height:0;display:none}   /* Chrome, Safari */

.l{margin-bottom:2px}
.l.sys{color:var(--fg)}
.l.dim{color:var(--dim)}
.l.echo{color:var(--mid)}
.l.deny{color:var(--fg)}
.l.gap{height:10px}

/* dossier photo. Desaturated and scanlined so it reads as something the
   terminal is displaying rather than a picture pasted onto the page. */
.dossier{margin:12px 0 14px}
.dossier .frame{position:relative;display:inline-block;line-height:0}
.dossier img{
  display:block;width:172px;height:auto;
  filter:grayscale(1) contrast(1.22) brightness(1.14);
  border:1px solid rgba(255,255,255,.45);
}
.dossier .frame::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.45) 0 1px,transparent 1px 3px);
}
.dossier video{
  display:block;width:300px;height:auto;background:#000;
  filter:grayscale(1) contrast(1.18) brightness(1.05);
  border:1px solid rgba(255,255,255,.45);
}
.cap{color:var(--dim);font-size:12px;letter-spacing:.12em;margin-top:7px}
/* a record the VOA has partially wiped: pushed further toward pure black and
   white, with two bands of missing scan data across it */
.dossier .frame.corrupt img{width:320px;filter:grayscale(1) contrast(1.55) brightness(.92)}
.dossier .frame.corrupt::before{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(transparent 0 26%,#000 26% 30.5%,transparent 30.5%),
    linear-gradient(transparent 0 62%,#000 62% 64.5%,transparent 64.5%);
}

/* input row */
.row{display:flex;align-items:baseline;gap:10px;flex:0 0 auto;padding-top:12px}
.ps{color:var(--fg);flex:0 0 auto}
#cmd{
  flex:1 1 auto;background:transparent;border:none;outline:none;
  color:var(--fg);font-family:var(--mono);font-size:15px;line-height:1.65;
  caret-color:var(--fg);padding:0;
}
#cmd::placeholder{color:rgba(255,255,255,.22)}

/* blinking block that sits at the end of the boot text before input is live */
.blink{display:inline-block;width:.62em;height:1em;background:var(--fg);
  vertical-align:-.15em;animation:b 1.05s step-end infinite}
@keyframes b{0%,50%{opacity:1}50.01%,100%{opacity:0}}

/* total failure. Distinct from the clean power-down: the whole screen judders and
   strobes rather than collapsing neatly, because this is the machine losing its
   mind rather than being switched off. */
body.crashing .screen{animation:judder .09s steps(2) infinite}
body.crashing{animation:strobe .21s steps(1) infinite}
@keyframes judder{
  0%  {transform:translate(0,0)   skewX(0deg)}
  25% {transform:translate(-6px,2px) skewX(1.4deg)}
  50% {transform:translate(5px,-3px) skewX(-1deg)}
  75% {transform:translate(-3px,-1px) skewX(.7deg)}
  100%{transform:translate(4px,3px)  skewX(-1.6deg)}
}
@keyframes strobe{
  0%,100%{filter:none}
  50%    {filter:invert(1)}
}
.l.junk{color:var(--fg);opacity:.85;word-break:break-all}

/* connection cut: the picture blows out bright, collapses to a line, and goes.
   The way a CRT dies when the power is pulled. */
body.dying .screen{
  transform-origin:50% 50%;
  animation:die 1.05s cubic-bezier(.6,0,.85,.4) forwards;
}
@keyframes die{
  0%   {opacity:1;transform:scaleY(1);filter:brightness(1)}
  45%  {opacity:1;transform:scaleY(1);filter:brightness(2.4) contrast(1.4)}
  72%  {opacity:1;transform:scaleY(.014);filter:brightness(3.4)}
  100% {opacity:0;transform:scaleY(0);filter:brightness(3.4)}
}
/* The watermark is centred with its own translate, so it needs matching
   keyframes that keep that translate. Animating plain scaleY here would drop
   the centring and throw the logo across the screen on its way out. */
body.dying .mark{
  transform-origin:50% 50%;
  animation:die-mark 1.05s cubic-bezier(.6,0,.85,.4) forwards;
}
@keyframes die-mark{
  0%   {opacity:.07;transform:translate(-50%,-50%) scaleY(1)}
  45%  {opacity:.16;transform:translate(-50%,-50%) scaleY(1)}
  72%  {opacity:.16;transform:translate(-50%,-50%) scaleY(.014)}
  100% {opacity:0;  transform:translate(-50%,-50%) scaleY(0)}
}

@media(max-width:640px){
  body{font-size:14px}
  .screen{padding:20px 16px 16px}
  #cmd{font-size:14px}
}

/* ==========================================================================
   VOA OS . the desktop behind the terminal
   Reached with  cmd://exit.terminal  . The terminal is a window on this
   machine, so leaving it drops the operator onto the shell they logged into.
   ========================================================================== */
#vos{position:fixed;inset:0;z-index:60;overflow:hidden;
  background:
    radial-gradient(ellipse 90% 70% at 50% 38%,#12233c 0%,#0a1524 45%,#04080e 100%);
  font-family:var(--mono);color:var(--fg);user-select:none}
#vos[hidden]{display:none}

/* the seal sits in the wallpaper, big and faint, the way an org badges its fleet */
.vos-paper{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.vos-paper img{width:min(46vmin,420px);opacity:.07;filter:grayscale(1) brightness(2.4)}
.vos-paper::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px)}

/* icon field */
.vos-icons{position:absolute;top:26px;left:26px;bottom:74px;
  display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,104px);
  gap:6px 4px;align-content:start}
.vos-ico{width:108px;padding:10px 6px 8px;border:1px solid transparent;border-radius:6px;
  background:none;font:inherit;color:inherit;cursor:pointer;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:7px}
.vos-ico svg{width:42px;height:42px;flex:0 0 auto;pointer-events:none}
.vos-ico span{font-size:10.5px;letter-spacing:.055em;text-transform:uppercase;line-height:1.3;
  color:rgba(255,255,255,.86);text-shadow:0 1px 3px #000;pointer-events:none;word-break:break-word}
.vos-ico:hover{background:rgba(120,180,255,.10);border-color:rgba(120,180,255,.20)}
.vos-ico.sel{background:rgba(62,160,255,.24);border-color:rgba(62,160,255,.62)}
.vos-ico:focus-visible{outline:none;border-color:#7fc0ff}
/* a locked file still shows, it just will not open. The padlock says so up front. */
.vos-ico.locked svg{opacity:.55}
.vos-ico.locked span{color:rgba(255,255,255,.5)}

/* taskbar */
.vos-bar{position:absolute;left:0;right:0;bottom:0;height:46px;z-index:3;
  display:flex;align-items:center;gap:10px;padding:0 12px;
  background:rgba(4,10,18,.88);backdrop-filter:blur(10px);
  border-top:1px solid rgba(120,180,255,.22)}
.vos-start{display:flex;align-items:center;gap:9px;height:32px;padding:0 14px;border-radius:5px;
  border:1px solid rgba(120,180,255,.3);background:rgba(62,160,255,.13);color:#bcdcff;
  font:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:default}
.vos-start img{width:16px;height:16px;filter:grayscale(1) brightness(2.6)}
.vos-tasks{display:flex;gap:8px;flex:1 1 auto;min-width:0;overflow:hidden}
.vos-task{height:32px;padding:0 15px;border-radius:5px;max-width:230px;overflow:hidden;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:rgba(255,255,255,.8);
  font:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
  white-space:nowrap;text-overflow:ellipsis}
.vos-task:hover{border-color:rgba(120,180,255,.5);color:#cfe6ff}
.vos-tray{display:flex;align-items:center;gap:16px;font-size:11px;letter-spacing:.1em;
  color:rgba(255,255,255,.62);white-space:nowrap}
.vos-tray b{color:rgba(255,255,255,.9);font-weight:400}

/* the dialog every sealed folder throws */
.vos-modal{position:absolute;inset:0;z-index:5;display:grid;place-items:center;
  background:rgba(2,5,10,.55)}
.vos-modal[hidden]{display:none}
.vos-win{width:min(420px,88vw);background:#0a1422;border:1px solid rgba(120,180,255,.34);
  border-radius:7px;box-shadow:0 26px 70px rgba(0,0,0,.7);overflow:hidden}
.vos-title{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 12px;background:rgba(62,160,255,.14);border-bottom:1px solid rgba(120,180,255,.24);
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#bcdcff}
.vos-x{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0 4px}
.vos-x:hover{color:#fff}
.vos-body{padding:20px 20px 18px;font-size:13px;line-height:1.6;color:rgba(255,255,255,.74)}
.vos-body b{display:block;color:#ff6b6b;letter-spacing:.1em;text-transform:uppercase;
  font-weight:400;font-size:12px;margin-bottom:8px}
.vos-act{display:flex;justify-content:flex-end;padding:0 20px 18px}
.vos-ok{height:31px;padding:0 22px;border-radius:5px;cursor:pointer;font:inherit;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;
  border:1px solid rgba(120,180,255,.42);background:rgba(62,160,255,.16);color:#cfe6ff}
.vos-ok:hover{background:rgba(62,160,255,.28)}

/* the hint line, so nobody is stranded on a desktop with no idea what to do */
.vos-tip{position:absolute;right:16px;bottom:60px;z-index:2;font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:rgba(255,255,255,.34);text-align:right;line-height:1.7}

@media(max-width:640px){
  .vos-icons{top:16px;left:14px;bottom:66px;grid-template-rows:repeat(auto-fill,96px)}
  .vos-ico{width:88px}
  .vos-ico svg{width:36px;height:36px}
  .vos-start span{display:none}
  .vos-tip{display:none}
  .vos-tray .vos-host{display:none}
}
</style>
</head>
<body class="crt">

<img class="mark" src="img/voa-logo.png" alt="" aria-hidden="true">

<main class="screen">
  <div class="bar">
    <span class="brand"><img src="img/voa-logo.png" alt="">VOA // SECURE TERMINAL</span>
    <span class="right">
      <button id="snd" type="button" aria-pressed="true">[ SOUND ON ]</button>
      <a href="index.html">[ DISCONNECT ]</a>
    </span>
  </div>

  <div class="gate" id="gate">
    <form class="gatebox" id="gatebox" autocomplete="off">
      <img class="gatemark" src="img/voa-logo.png" alt="">
      <div class="gtitle">VOA SECURE TERMINAL</div>
      <div class="gsub">Authorisation required</div>
      <div class="gfield">
        <span class="gps">&gt;</span>
        <input id="pw" type="password" autocomplete="off" autocapitalize="off"
               autocorrect="off" spellcheck="false" aria-label="Passphrase">
      </div>
      <div class="gmsg" id="gmsg">Enter passphrase</div>
    </form>
  </div>

  <div class="out" id="out" aria-live="polite" hidden></div>

  <div class="row" id="row" hidden>
    <span class="ps">&gt;</span>
    <input id="cmd" type="text" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" aria-label="Enter input code">
  </div>
</main>

<!-- VOA OS. Hidden until the operator runs cmd://exit.terminal, and it is a sibling of
     the terminal rather than a separate page so the session survives the trip back. -->
<div id="vos" hidden>
  <div class="vos-paper"><img src="img/voa-logo.png" alt=""></div>

  <div class="vos-icons" id="vosIcons">
    <button class="vos-ico" data-act="terminal">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect x="4" y="7" width="40" height="34" rx="3" fill="#0c1a2b" stroke="#7fc0ff" stroke-width="2"/>
        <path d="M11 18l7 6-7 6" stroke="#7fc0ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M23 31h13" stroke="#7fc0ff" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <span>VOA Secure Terminal</span>
    </button>

    <button class="vos-ico" data-act="bbb">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M4 12a2 2 0 012-2h12l4 5h18a2 2 0 012 2v20a2 2 0 01-2 2H6a2 2 0 01-2-2V12z" fill="#123554" stroke="#7fc0ff" stroke-width="2"/>
        <path d="M4 20h40" stroke="#7fc0ff" stroke-width="1.6" opacity=".55"/>
      </svg>
      <span>Beef Boss's Burgers</span>
    </button>

    <button class="vos-ico" data-act="sealed" data-tier="4" data-name="Trade Registry">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M4 12a2 2 0 012-2h12l4 5h18a2 2 0 012 2v20a2 2 0 01-2 2H6a2 2 0 01-2-2V12z" fill="#123554" stroke="#7fc0ff" stroke-width="2"/>
        <path d="M4 20h40" stroke="#7fc0ff" stroke-width="1.6" opacity=".55"/>
      </svg>
      <span>Trade Registry</span>
    </button>

    <button class="vos-ico" data-act="sealed" data-tier="5" data-name="Lyssara Survey">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M4 12a2 2 0 012-2h12l4 5h18a2 2 0 012 2v20a2 2 0 01-2 2H6a2 2 0 01-2-2V12z" fill="#123554" stroke="#7fc0ff" stroke-width="2"/>
        <path d="M4 20h40" stroke="#7fc0ff" stroke-width="1.6" opacity=".55"/>
      </svg>
      <span>Lyssara Survey</span>
    </button>

    <button class="vos-ico" data-act="sealed" data-tier="6" data-name="Biome Controller">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M4 12a2 2 0 012-2h12l4 5h18a2 2 0 012 2v20a2 2 0 01-2 2H6a2 2 0 01-2-2V12z" fill="#123554" stroke="#7fc0ff" stroke-width="2"/>
        <path d="M4 20h40" stroke="#7fc0ff" stroke-width="1.6" opacity=".55"/>

    </button>

    <button class="vos-ico" data-act="sealed" data-tier="6" data-name="TRA-04 Array">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M4 12a2 2 0 012-2h12l4 5h18a2 2 0 012 2v20a2 2 0 01-2 2H6a2 2 0 01-2-2V12z" fill="#123554" stroke="#7fc0ff" stroke-width="2"/>
        <path d="M4 20h40" stroke="#7fc0ff" stroke-width="1.6" opacity=".55"/>
      </svg>
      <span>TRA-04 Array</span>
    </button>

    <button class="vos-ico locked" data-act="sealed" data-tier="8" data-name="Incident Reports">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M4 12a2 2 0 012-2h12l4 5h18a2 2 0 012 2v20a2 2 0 01-2 2H6a2 2 0 01-2-2V12z" fill="#123554" stroke="#7fc0ff" stroke-width="2"/>
        <rect x="17" y="24" width="14" height="11" rx="1.6" fill="#04080e" stroke="#7fc0ff" stroke-width="2"/>
        <path d="M20 24v-3a4 4 0 018 0v3" stroke="#7fc0ff" stroke-width="2"/>
      </svg>
      <span>Incident Reports</span>
    </button>

    <button class="vos-ico locked" data-act="sealed" data-tier="9" data-name="Subject J">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M4 12a2 2 0 012-2h12l4 5h18a2 2 0 012 2v20a2 2 0 01-2 2H6a2 2 0 01-2-2V12z" fill="#123554" stroke="#7fc0ff" stroke-width="2"/>
        <rect x="17" y="24" width="14" height="11" rx="1.6" fill="#04080e" stroke="#7fc0ff" stroke-width="2"/>
        <path d="M20 24v-3a4 4 0 018 0v3" stroke="#7fc0ff" stroke-width="2"/>
      </svg>
      <span>Subject J</span>
    </button>

/* ============================================================================
   SOUND
   ----------------------------------------------------------------------------
   Everything here is generated with the Web Audio API. There are no audio files
   to host, and the hum drifts slowly rather than looping, so it never develops
   an audible seam.

     hum   a low drone plus filtered hiss, the noise a CRT and its power supply make
     key   a short filtered noise burst, pitched randomly so it is not robotic

   Browsers refuse to start audio before the user interacts with the page, so the
   context is created on the first click or keypress. Volume lives in the master
   gain; the toggle in the header just moves that to 0 and remembers the choice.
   ========================================================================== */
const Sound = (function(){
  let ctx = null, master = null, hum = null, buf = null;
  let humGain = null, humOsc = null;   // kept so powerDown can bend them
  let on = true;
  try { on = localStorage.getItem("voa_sound") !== "0"; } catch(e){}

  function noise(){
    if (buf) return buf;
    const n = Math.floor(ctx.sampleRate * 0.4);
    buf = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  function ensure(){
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = on ? 1 : 0;
    master.connect(ctx.destination);
  }

  function startHum(){
    if (!ctx || hum) return;
    const t = ctx.currentTime;
    const g = ctx.createGain();
    g.gain.value = 0;

    const o1 = ctx.createOscillator();            // the drone
    o1.type = "sine"; o1.frequency.value = 58;
    const o2 = ctx.createOscillator();            // one harmonic above it
    o2.type = "sine"; o2.frequency.value = 116;
    const o2g = ctx.createGain(); o2g.gain.value = 0.3;

    const hiss = ctx.createBufferSource();        // electrical hiss
    hiss.buffer = noise(); hiss.loop = true;
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 880;
    const hg = ctx.createGain(); hg.gain.value = 0.05;

    const drift = ctx.createOscillator();         // stops it sitting perfectly still
    drift.frequency.value = 0.13;
    const driftAmt = ctx.createGain(); driftAmt.gain.value = 2.2;
    drift.connect(driftAmt); driftAmt.connect(o1.frequency);

    o1.connect(g);
    o2.connect(o2g); o2g.connect(g);
    hiss.connect(lp); lp.connect(hg); hg.connect(g);
    g.connect(master);

    o1.start(); o2.start(); hiss.start(); drift.start();
    g.gain.setTargetAtTime(0.06, t, 1.4);         // fade up over a couple of seconds
    humGain = g; humOsc = o1;
    hum = true;
  }

  function key(vol){
    if (!ctx || !on) return;
    const t = ctx.currentTime;
    const s = ctx.createBufferSource();
    s.buffer = noise();
    s.playbackRate.value = 0.8 + Math.random() * 0.5;
    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = 1400 + Math.random() * 1300;
    bp.Q.value = 1.1;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
    s.connect(bp); bp.connect(g); g.connect(master);
    s.start(t); s.stop(t + 0.07);
  }

  /* Returns a promise for whether audio is actually running. Browsers keep a new
     context suspended until the document has been interacted with, and resume()
     only succeeds from inside a real gesture, so the caller needs to know if it
     worked rather than assuming it did. */
  function wake(){
    ensure();
    if (!ctx) return Promise.resolve(false);
    const finish = () => {
      if (ctx.state === "running"){ startHum(); return true; }
      return false;
    };
    if (ctx.state === "suspended"){
      return ctx.resume().then(finish).catch(() => false);
    }
    return Promise.resolve(finish());
  }

  function running(){ return !!ctx && ctx.state === "running"; }

  function toggle(){
    on = !on;
    try { localStorage.setItem("voa_sound", on ? "1" : "0"); } catch(e){}
    if (master) master.gain.setTargetAtTime(on ? 1 : 0, ctx.currentTime, 0.05);
    if (on) wake();
    return on;
  }

  /* Rejection tone: two short low square-wave buzzes, the second a step down
     from the first. Filtered so it reads as a dull machine buzz rather than a
     clean musical beep. */
  function error(){
    if (!ctx || !on) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    o.type = "square";
    o.frequency.setValueAtTime(196, t);
    o.frequency.setValueAtTime(147, t + 0.115);
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 1150;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.085, t + 0.008);
    g.gain.setValueAtTime(0.085, t + 0.095);
    g.gain.linearRampToValueAtTime(0, t + 0.108);      // beat between the buzzes
    g.gain.linearRampToValueAtTime(0.085, t + 0.122);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);
    o.connect(lp); lp.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.32);
  }

  /* Total failure. Not a tidy power-down: a stack of detuned oscillators sliding
     downward against a wall of noise, swelling and then cut dead. This is the only
     sound on the page that is meant to be unpleasant. */
  function crash(){
    if (!ctx || !on) return;
    const t = ctx.currentTime;
    const bus = ctx.createGain();
    bus.gain.setValueAtTime(0, t);
    bus.gain.linearRampToValueAtTime(0.16, t + 0.30);
    bus.gain.setValueAtTime(0.16, t + 1.55);
    bus.gain.linearRampToValueAtTime(0, t + 1.62);   // cut, not faded
    bus.connect(master);

    [61, 87, 113, 146].forEach((f, i) => {
      const o = ctx.createOscillator();
      o.type = i % 2 ? "square" : "sawtooth";
      o.frequency.setValueAtTime(f * 3, t);
      o.frequency.exponentialRampToValueAtTime(f * 0.5, t + 1.55);
      const g = ctx.createGain();
      g.gain.value = 0.5;
      o.connect(g); g.connect(bus);
      o.start(t); o.stop(t + 1.62);
    });

    const n = ctx.createBufferSource();
    n.buffer = noise(); n.loop = true;
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.setValueAtTime(5200, t);
    lp.frequency.exponentialRampToValueAtTime(300, t + 1.55);
    const ng = ctx.createGain(); ng.gain.value = 0.55;
    n.connect(lp); lp.connect(ng); ng.connect(bus);
    n.start(t); n.stop(t + 1.62);
  }

  /* Interference: a burst of noise swept through a bandpass. Someone else is on
     the line. Not one of the VOA's own cues, so it should not sound tidy. */
  function glitch(){
    if (!ctx || !on) return;
    const t = ctx.currentTime;
    const s = ctx.createBufferSource();
    s.buffer = noise();
    s.playbackRate.value = 0.6;
    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass";
    bp.Q.value = 0.8;
    bp.frequency.setValueAtTime(240, t);
    bp.frequency.exponentialRampToValueAtTime(3600, t + 0.16);
    bp.frequency.exponentialRampToValueAtTime(380, t + 0.30);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.10, t + 0.02);
    g.gain.setValueAtTime(0.10, t + 0.22);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
    s.connect(bp); bp.connect(g); g.connect(master);
    s.start(t); s.stop(t + 0.36);
  }

  /* Power on: a filtered sweep climbing out of nothing, then two bright blips to
     confirm. Longer and warmer than any of the other cues, because this is the
     only sound on the page that means something went right. */
  function startup(){
    if (!ctx || !on) return;
    const t = ctx.currentTime;

    const o = ctx.createOscillator();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(70, t);
    o.frequency.exponentialRampToValueAtTime(480, t + 0.5);
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.setValueAtTime(320, t);
    lp.frequency.exponentialRampToValueAtTime(3400, t + 0.54);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.05, t + 0.10);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.66);
    o.connect(lp); lp.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.7);

    [[523.25, 0.46], [783.99, 0.58]].forEach(pair => {
      const s = t + pair[1];
      const b = ctx.createOscillator();
      b.type = "triangle";
      b.frequency.value = pair[0];
      const bg = ctx.createGain();
      bg.gain.setValueAtTime(0, s);
      bg.gain.linearRampToValueAtTime(0.05, s + 0.006);
      bg.gain.exponentialRampToValueAtTime(0.0001, s + 0.19);
      b.connect(bg); bg.connect(master);
      b.start(s); b.stop(s + 0.22);
    });
  }

  /* Pull the hum and clicks down so a playing tape can be heard over them. */
  function duck(state){
    if (!ctx || !master) return;
    const target = on ? (state ? 0.18 : 1) : 0;
    master.gain.setTargetAtTime(target, ctx.currentTime, 0.09);
  }

  /* Found something: two clean triangle blips going UP. The rejection buzz is
     low, square and descending, so these two should never be confused. */
  function hit(){
    if (!ctx || !on) return;
    const t = ctx.currentTime;
    [[659, 0], [880, 0.085]].forEach(pair => {
      const s = t + pair[1];
      const o = ctx.createOscillator();
      o.type = "triangle";
      o.frequency.value = pair[0];
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, s);
      g.gain.linearRampToValueAtTime(0.055, s + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.09);
      o.connect(g); g.connect(master);
      o.start(s); o.stop(s + 0.11);
    });
  }

  /* Alarm: three rising square beeps. Deliberately harsher and higher than the
     rejection buzz, so a trace does not sound like an ordinary wrong answer. */
  function alarm(){
    if (!ctx || !on) return;
    const t = ctx.currentTime;
    for (let i = 0; i < 3; i++){
      const s = t + i * 0.135;
      const o = ctx.createOscillator();
      o.type = "square";
      o.frequency.value = 440 + i * 170;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, s);
      g.gain.linearRampToValueAtTime(0.075, s + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.115);
      o.connect(g); g.connect(master);
      o.start(s); o.stop(s + 0.14);
    }
  }

  /* Power-down for disconnecting: the drone bends downward and dies while a
     short thump fires over the top of it, the way a CRT collapses when cut. */
  function powerDown(){
    if (!ctx || !on || !hum) return 0;
    const t = ctx.currentTime;

    humGain.gain.cancelScheduledValues(t);
    humGain.gain.setValueAtTime(humGain.gain.value, t);
    humGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
    humOsc.frequency.cancelScheduledValues(t);
    humOsc.frequency.setValueAtTime(humOsc.frequency.value, t);
    humOsc.frequency.exponentialRampToValueAtTime(14, t + 0.40);

    const s = ctx.createBufferSource();
    s.buffer = noise();
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.setValueAtTime(2200, t);
    lp.frequency.exponentialRampToValueAtTime(120, t + 0.30);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.14, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
    s.connect(lp); lp.connect(g); g.connect(master);
    s.start(t); s.stop(t + 0.34);

    return 420;                                   // ms for the caller to wait
  }

  return { wake, toggle, key, error, hit, alarm, startup, glitch, crash,
           duck, powerDown, running, isOn: () => on };
})();

const out = document.getElementById("out");
const row = document.getElementById("row");
const cmd = document.getElementById("cmd");

function line(cls, text){
  const d = document.createElement("div");
  d.className = "l " + cls;
  if (cls !== "gap") d.textContent = reveal(text);
  out.appendChild(d);
  out.scrollTop = out.scrollHeight;
  return d;
}

/* Types a line out one character at a time. Resolves when finished. */
function type(cls, rawText, speed){
  const text = reveal(rawText);
  return new Promise(resolve => {
    if (cls === "gap"){ line("gap",""); return resolve(); }
    const d = line(cls, "");
    const caret = document.createElement("span");
    caret.className = "blink";
    d.appendChild(caret);
    let i = 0;
    (function step(){
      if (i >= text.length){
        caret.remove();
        d.textContent = text;
        return resolve();
      }
      caret.remove();
      d.textContent = text.slice(0, ++i);
      d.appendChild(caret);
      out.scrollTop = out.scrollHeight;
      if (i % 2 === 0) Sound.key(0.018);   // quiet chatter while it prints
      setTimeout(step, speed);
    })();
  });
}

function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

/* Stops the visitor typing over a response while it is still printing. */
function lockInput(state){
  cmd.disabled = state;
  row.style.opacity = state ? ".4" : "1";
  if (!state) cmd.focus();
}

function photo(src, cap, extra){
  const wrap = document.createElement("div");
  wrap.className = "dossier";
  const frame = document.createElement("div");
  frame.className = "frame" + (extra ? " " + extra : "");
  const im = document.createElement("img");
  im.src = src;
  im.alt = "";
  frame.appendChild(im);
  wrap.appendChild(frame);
  if (cap){
    const c = document.createElement("div");
    c.className = "cap";
    c.textContent = reveal(cap);
    wrap.appendChild(c);
  }
  out.appendChild(wrap);
  out.scrollTop = out.scrollHeight;
}

/* Same framing as photo(), but for footage. Not autoplayed: a tape the visitor
   chooses to run lands better than one that starts shouting. The hum ducks while
   it plays so the two are not competing. */
function tape(src, cap){
  const wrap = document.createElement("div");
  wrap.className = "dossier";
  const frame = document.createElement("div");
  frame.className = "frame";
  const v = document.createElement("video");
  v.src = src;
  v.controls = true;
  v.preload = "metadata";
  v.playsInline = true;
  v.addEventListener("play",  () => Sound.duck(true));
  v.addEventListener("pause", () => Sound.duck(false));
  v.addEventListener("ended", () => Sound.duck(false));
  frame.appendChild(v);
  wrap.appendChild(frame);
  if (cap){
    const c = document.createElement("div");
    c.className = "cap";
    c.textContent = reveal(cap);
    wrap.appendChild(c);
  }
  out.appendChild(wrap);
  out.scrollTop = out.scrollHeight;
}

/* The VOA's own file on Jules. Written from their side: she is a problem they
   have not solved, Argantha is something they will not name plainly, and
   Project 72 is referred to as though the reader already knows what it was.
   She was never VOA, so nothing here should imply she once had standing with
   them. She is an inventor who fell onto Lyssara with the wreck of her planet. */
const B = "█";

/* ---- redactions -----------------------------------------------------------
   Every blacked out value is written as a token carrying the truth behind it,
   and resolved when the line is printed rather than when the data is defined.
   That matters because LOGS and POIS are built at load time.

     {TRUTH|6}        prints six block characters
     {{TRUTH}}        prints [ SEALED ]
     {{TRUTH?LABEL}}  same, with your own placeholder wording

   ADMIN is the switch. It is false and there is currently no way to set it, so
   everything renders redacted; the truths are kept in the source as the canon
   record of what is actually behind each bar. Flip it to true if a higher
   clearance is ever wanted again. */
let ADMIN = false;
function reveal(text){
  return String(text)
    .replace(/\{\{([^}?]*)(?:\?([^}]*))?\}\}/g,
             (m, truth, label) => ADMIN ? truth : (label || "[ SEALED ]"))
    .replace(/\{([^}|]*)\|(\d+)\}/g,
             (m, truth, len) => ADMIN ? truth : B.repeat(parseInt(len, 10)));

/* Accepts 7, 07, 0007. Anything inside the archive's range is a real entry, so an
   unknown number is sealed rather than missing. That is what makes the other 4180
   feel like they exist. */
function logKey(raw){
  if (!/^\d{1,4}$/.test(raw)) return null;
  const n = parseInt(raw, 10);
  if (n < 1 || n > 4188) return null;
  return String(n).padStart(4, "0");
}

/* Odyssey brings the whole thing down. Not a trace and not an ejection: the
   terminal loses coherence, spits garbage, strobes, and reboots back to the lock
   screen. The visitor is not thrown out so much as the machine gives up. */
// note: no "/*" or "*/" pairs in here, so this stays safe to comment out
const JUNK = "!<>#@%&/\\|=+-_~^:;[]{}*0123456789ABCDEF" + B;
function junkLine(len){
  let s = "";
  for (let i = 0; i < len; i++) s += JUNK[Math.floor(Math.random() * JUNK.length)];
  return s;
}

async function odysseyCrash(){
  lockInput(true);

  await wait(300);              // one beat of nothing, then it goes

  // No reply, no error, no explanation. The terminal never acknowledges the word.
  Sound.crash();
  document.body.classList.add("crashing");

  for (let i = 0; i < 30; i++){
    line("junk", junkLine(46 + Math.floor(Math.random() * 26)));
    await wait(50);
  }

  await wait(380);
  document.body.classList.remove("crashing");
  out.innerHTML = "";
  Sound.powerDown();
  setTimeout(() => { location.reload(); }, 1100);
}

/* The boot text is worth watching once. After a crash you land
   back here and sit through it again, so it can be shortened: enter SKIP to
   remember the preference, or press any key while it prints to rush that one. */
let skipBoot = false;
try { skipBoot = localStorage.getItem("voa_skipboot") === "1"; } catch(e){}
let bootRushed = false;

async function boot(){
  sessionLive = true;
  bootRushed = false;
  const rush = () => { bootRushed = true; };
  window.addEventListener("keydown", rush, true);
  window.addEventListener("pointerdown", rush, true);

  for (const [cls, text] of BOOT){
    if (skipBoot || bootRushed){
      line(cls, text);
    } else {
      await type(cls, text, 16);
      await new Promise(r => setTimeout(r, cls === "gap" ? 0 : 90));
    }
  }

  window.removeEventListener("keydown", rush, true);
  window.removeEventListener("pointerdown", rush, true);

  if (!skipBoot) line("dim", "ENTER SKIP TO SHORTEN THIS ON FUTURE SESSIONS.");
  line("gap", "");
  row.hidden = false;
  cmd.focus();
}

function skipToggle(){
  skipBoot = !skipBoot;
  try { localStorage.setItem("voa_skipboot", skipBoot ? "1" : "0"); } catch(e){}
  Sound.hit();
  line("sys", skipBoot ? "BOOT SEQUENCE SHORTENED." : "BOOT SEQUENCE RESTORED.");
  line("dim", "ENTER SKIP AGAIN TO REVERSE THIS.");
  line("gap", "");
}

let lastKey = null;    // previous query, so an immediate repeat can be caught

function submit(raw){
  const shown = raw.trim();

  // Echo whatever they typed, so the log reads like a real session.
  line("echo", "> " + shown);

  if (!shown){                     // bare Enter just gives them a fresh prompt
    return;
  }

  const key = shown.toLowerCase();

  // Leaving the terminal is a real command on this machine, not a link.
  if (key === "cmd://exit.terminal"){ exitTerminal(); return; }
  if (Object.prototype.hasOwnProperty.call(CODES, key)){
    line("sys", "ACCESS GRANTED");
    line("dim", "REROUTING ...");
    setTimeout(() => { location.href = CODES[key]; }, 900);
    return;
  }

  // Asking for Argantha twice with nothing in between gets you traced and cut off.
  if (key === "argantha" && lastKey === "argantha"){
    lastKey = key;
    lockout();
    return;
  }
  lastKey = key;

  if (Object.prototype.hasOwnProperty.call(RESPONSES, key)){
    RESPONSES[key]();
    return;
  }

  /* A bare number is a log lookup against the Lyssara archive. Checked AFTER the
     named codes so that "72" still reaches Project 72 rather than log 0072. */
  const lg = logKey(key);
  if (lg){ logRecord(lg); return; }

  Sound.error();
  line("deny", DENIED[Math.floor(Math.random() * DENIED.length)]);
  line("gap", "");
}

cmd.addEventListener("keydown", e => {
  if (e.key === "Enter"){
    e.preventDefault();
    Sound.key(0.075);                    // a firmer thock for the return key
    const v = cmd.value;
    cmd.value = "";
    submit(v);
    return;
  }
  // Ignore modifiers and navigation so only real typing makes a sound.
  if (e.key.length === 1 || e.key === "Backspace") Sound.key(0.05);
});

/* ---- getting audio started -------------------------------------------------
   A browser will not let audio run until the user has interacted with THIS
   document, and following a link does not count. So rather than waiting for a
   deliberate click, arm on the first interaction of any kind: a key, a tap, a
   pointer press, even the scroll wheel. In practice the input is focused on
   arrival, so the first character typed starts it. Until then the header says
   so, instead of the page looking silently broken. */
const sndBtn = document.getElementById("snd");
let armed = false;

function paintSndBtn(){
  const on = Sound.isOn();
  sndBtn.textContent = !on ? "[ SOUND OFF ]"
                      : armed ? "[ SOUND ON ]"
                      : "[ SOUND: PRESS ANY KEY ]";
  sndBtn.setAttribute("aria-pressed", String(on));
}

const WAKE_EVENTS = ["pointerdown","mousedown","keydown","touchstart","wheel","click"];
function detachWake(){
  WAKE_EVENTS.forEach(e => window.removeEventListener(e, arm, true));
}
function arm(){
  if (armed) return;
  Sound.wake().then(ok => {
    if (!ok) return;
    armed = true;
    detachWake();
    paintSndBtn();
  });
}
WAKE_EVENTS.forEach(e => window.addEventListener(e, arm, true));

arm();            // optimistic: works where the browser already trusts the site
paintSndBtn();

sndBtn.addEventListener("click", () => { Sound.toggle(); paintSndBtn(); });

/* Let the power-down finish before the page actually goes away. */
document.querySelector('.bar a[href="index.html"]').addEventListener("click", e => {
  const wait = Sound.powerDown();
  if (!wait) return;                      // no audio running, leave the link alone
  e.preventDefault();
  setTimeout(() => { location.href = "index.html"; }, wait);
});

/* Clicking anywhere on the screen puts you back in the input, the way a
   terminal behaves. Ignore clicks on the disconnect link. */
document.addEventListener("mousedown", e => {
  if (e.target.closest("a") || e.target.closest("button")) return;
  if (window.getSelection && String(window.getSelection())) return;
  // whichever field is live: the passphrase while locked, the prompt once inside
  const field = document.body.contains(gate) ? pw : (row.hidden ? null : cmd);
  if (!field || field.disabled) return;
  setTimeout(() => field.focus(), 0);
});

/* ---- lock screen --------------------------------------------------------- */
const PASSPHRASE = "cyprus nell";

const gate    = document.getElementById("gate");
const gatebox = document.getElementById("gatebox");
const pw      = document.getElementById("pw");
const gmsg    = document.getElementById("gmsg");

function gsay(text, bad){
  gmsg.textContent = text;
  gmsg.classList.toggle("bad", !!bad);
  gmsg.classList.remove("res");
}

/* Resistance voice: lower case, no shouting. */
function rsay(text){
  gmsg.textContent = text;
  gmsg.classList.remove("bad");
  gmsg.classList.add("res");
}

async function flash(times){
  for (let i = 0; i < times; i++){
    gatebox.classList.add("flash");
    await wait(70);
    gatebox.classList.remove("flash");
    await wait(60);
  }
}

/* Get the passphrase wrong once and Jules' people cut in, tell you not to bother
   with the VOA's door, and type it for you. The field is switched to plain text
   first, on purpose: the whole point is that you SEE what they put in, so nobody
   ends up stuck outside. */
let hacked = false;
async function resistanceHack(){
  hacked = true;
  pw.disabled = true;

  await wait(760);
  Sound.glitch();
  await flash(2);
  rsay("signal intercepted");
  await wait(900);

  await flash(1);
  rsay("don't waste your time on their door.");
  await wait(1300);

  rsay("we already have it. here.");
  await wait(800);

  // unmask, then type it in where it can be read
  pw.type = "text";
  pw.value = "";
  pw.disabled = false;
  pw.focus();
  for (const ch of PASSPHRASE){
    pw.value += ch;
    Sound.key(0.045);
    await wait(95);
  }

  await wait(820);
  rsay("go.");
  await wait(760);
  unlock();
}

/* Naming her at the door is not a wrong password, it is an admission, so it gets
   the trace treatment rather than a rejection. */
async function gateKick(){
  pw.disabled = true;
  Sound.alarm();
  gsay("Subject name entered", true);
  await wait(620);
  gsay("Trace initiated", true);
  await wait(700);
  gsay("Terminating connection", true);
  await wait(560);
  document.body.classList.add("dying");
  Sound.powerDown();
  setTimeout(() => { location.href = "index.html"; }, 1250);
}

async function unlock(){
  pw.disabled = true;
  Sound.startup();
  gsay("Accepted");
  await wait(340);
  gsay("Establishing session ...");
  await wait(900);

  gate.remove();
  out.hidden = false;
  boot();
}

gatebox.addEventListener("submit", e => {
  e.preventDefault();
  const raw = pw.value.trim();
  const key = raw.toLowerCase();

  if (!raw) return;

  if (key === PASSPHRASE){ unlock(); return; }
  if (key === "jules"){ gateKick(); return; }

  Sound.error();
  pw.value = "";
  gsay("Rejected", true);
  gatebox.classList.remove("shake");
  void gatebox.offsetWidth;              // restart the animation
  gatebox.classList.add("shake");

  if (!hacked) resistanceHack();         // they only need to see you try once
});

pw.addEventListener("keydown", e => {
  if (e.key.length === 1 || e.key === "Backspace") Sound.key(0.05);
});


/* ---- VOA OS ----------------------------------------------------------------
   cmd://exit.terminal suspends the session and drops the operator onto the
   machine the terminal runs on. The desktop is a sibling of <main>, not another
   page, so coming back is just a matter of swapping which one is hidden and the
   whole log is still there. The one trip that does leave the page, the burger
   place, sets a session flag so the return landing is the desktop and not the
   passphrase gate again.
   -------------------------------------------------------------------------- */
let sessionLive = false;                 // has the terminal log started this page load
const DESK_KEY  = "voaDesktop";

const vos       = document.getElementById("vos");
const vosScreen = document.querySelector("main.screen");
const vosIcons  = document.getElementById("vosIcons");
const vosTasks  = document.getElementById("vosTasks");
const vosClock  = document.getElementById("vosClock");
const vosModal  = document.getElementById("vosModal");
let clockTimer  = null;

function deskFlag(on){
  try { on ? sessionStorage.setItem(DESK_KEY, "1") : sessionStorage.removeItem(DESK_KEY); }
  catch(e){}
}

function paintClock(){
  const d = new Date();
  vosClock.innerHTML = "<b>" + String(d.getHours()).padStart(2,"0") + ":" +
                       String(d.getMinutes()).padStart(2,"0") + "</b>";
}

/* The terminal keeps a taskbar button while it is suspended, so the way back is
   visible even if somebody never tries the desktop icon. */
function paintTasks(){
  vosTasks.innerHTML = "";
  const b = document.createElement("button");
  b.type = "button";
  b.className = "vos-task";
  b.textContent = sessionLive ? "VOA Secure Terminal . suspended" : "VOA Secure Terminal";
  b.addEventListener("click", openTerminal);
  vosTasks.appendChild(b);
}

function openDesktop(){
  vosScreen.hidden = true;
  vos.hidden = false;
  cmd.disabled = true;                   // keystrokes belong to the desktop now
  deskFlag(true);
  paintTasks();
  paintClock();
  clockTimer = setInterval(paintClock, 15000);
  const first = vosIcons.querySelector(".vos-ico");
  if (first) first.focus();
}

function openTerminal(){
  closeDialog();
  vos.hidden = true;
  vosScreen.hidden = false;
  deskFlag(false);
  clearInterval(clockTimer);
  clockTimer = null;
  Sound.startup();
  if (!sessionLive){                     // came back to a cold page, so start a session
    if (gate && gate.parentNode) gate.remove();
    out.hidden = false;
    row.hidden = false;
    cmd.disabled = false;
    boot();
  } else {
    cmd.disabled = false;
    cmd.focus();
  }
}

async function exitTerminal(){
  lockInput(true);
  Sound.hit();
  await type("sys", "SESSION SUSPENDED", 14);
  await wait(240);
  await type("dim", "RELEASING TERMINAL TO SHELL ...", 12);
  await wait(300);
  await wait(Sound.powerDown() || 320);   // kills the terminal hum, returns its own length
  line("gap", "");
  lockInput(false);
  cmd.disabled = true;
  openDesktop();
}

/* dialogs */
function showDialog(title, head, text){
  document.getElementById("vosModalTitle").textContent = title;
  document.getElementById("vosModalHead").textContent  = head;
  document.getElementById("vosModalText").textContent  = text;
  vosModal.hidden = false;
  vosModal.querySelector(".vos-ok").focus();
}
function closeDialog(){ vosModal.hidden = true; }

vosModal.addEventListener("click", e => {
  if (e.target === vosModal || e.target.hasAttribute("data-close")) closeDialog();
});

function iconAct(el){
  const act = el.dataset.act;
  if (act === "terminal"){ openTerminal(); return; }
  if (act === "bbb"){ Sound.hit(); deskFlag(true); location.href = "bbb.html"; return; }
  if (act === "bin"){
    Sound.hit();
    showDialog("Recycle Bin", "Empty",
      "Nothing has been deleted from this machine. Deletions are handled centrally and are not reversible from an operator terminal.");
    return;
  }
  Sound.error();
  showDialog(el.dataset.name || "Access Control", "Access denied",
    (el.dataset.name || "This folder") + " requires Tier " + (el.dataset.tier || "9") +
    " clearance. This terminal is Tier 2. Request escalation through your superior.");
}

/* Single click selects, double click opens, which is what a desktop is expected to do.
   Enter and Space open too, so the icon field is usable from the keyboard. */
vosIcons.addEventListener("click", e => {
  const el = e.target.closest(".vos-ico");
  if (!el) return;
  vosIcons.querySelectorAll(".vos-ico.sel").forEach(n => n.classList.remove("sel"));
  el.classList.add("sel");
  Sound.key(0.04);
});
vosIcons.addEventListener("dblclick", e => {
  const el = e.target.closest(".vos-ico");
  if (el) iconAct(el);
});
vosIcons.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const el = e.target.closest(".vos-ico");
  if (!el) return;
  e.preventDefault();
  iconAct(el);
});
vos.addEventListener("click", e => {
  if (e.target === vos || e.target.classList.contains("vos-paper")){
    vosIcons.querySelectorAll(".vos-ico.sel").forEach(n => n.classList.remove("sel"));
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !vosModal.hidden) closeDialog();
});

/* Landing here from a page the desktop opened: skip the gate, show the desktop. */
let vosRestore = false;
try { vosRestore = sessionStorage.getItem(DESK_KEY) === "1"; } catch(e){}
if (vosRestore){
  if (gate && gate.parentNode) gate.remove();
  openDesktop();
} else {
  pw.focus();
}
</script>
